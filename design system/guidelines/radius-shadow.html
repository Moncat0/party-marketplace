<!-- @dsCard group="Foundations" viewport="700x150" name="Radius & Shadow" subtitle="Medium radii; soft minimal shadows drive most UI" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:20px;height:150px;padding:16px;box-sizing:border-box;font-family:var(--font-body);font-size:11px;color:var(--ink-500);align-items:center">
<div style="width:90px;height:90px;background:var(--white);border:1px solid var(--color-border-subtle);border-radius:var(--radius-md);box-shadow:var(--shadow-soft-sm);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px">soft sm</div>
<div style="width:90px;height:90px;background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft-md);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px">soft md</div>
<div style="width:90px;height:90px;background:var(--orange-500);border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;color:#fff">pill</div>
<div style="width:90px;height:90px;background:var(--pink-500);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:#fff">sm</div>
</div>
