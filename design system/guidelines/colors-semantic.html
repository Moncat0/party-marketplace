<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:10px;height:100px;font-family:var(--font-body);font-size:12px;font-weight:600;color:#fff">
<div style="flex:1;background:var(--color-success);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center">Success</div>
<div style="flex:1;background:var(--color-warning);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center">Warning</div>
<div style="flex:1;background:var(--color-danger);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center">Danger</div>
</div>
