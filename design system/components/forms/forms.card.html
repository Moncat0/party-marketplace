<!-- @dsCard group="Components" viewport="700x320" name="Forms: Input, Select, Checkbox, Radio, Switch" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="background:var(--color-bg);padding:20px"></div>
<script type="text/babel">
const {Input,Select,Checkbox,Radio,Switch}=window.FestlyDesignSystem_65deb2;
function Demo(){
const [chk,setChk]=React.useState(true);
const [rad,setRad]=React.useState('card');
const [sw,setSw]=React.useState(false);
return (<div style={{display:'flex',flexDirection:'column',gap:16,maxWidth:320}}>
<Input label="Event name" placeholder="e.g. Maya's birthday"/>
<Select label="Event type" options={['Birthday','Wedding','Corporate']}/>
<Checkbox checked={chk} onChange={setChk} label="I agree to the cancellation policy"/>
<div style={{display:'flex',gap:20}}>
<Radio checked={rad==='card'} onChange={()=>setRad('card')} label="Card"/>
<Radio checked={rad==='cash'} onChange={()=>setRad('cash')} label="Cash"/>
</div>
<Switch checked={sw} onChange={setSw} label="Instant book"/>
</div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
